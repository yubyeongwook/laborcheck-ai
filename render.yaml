services:
  - type: web
    name: laborcheck-ai
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /((?!naverc.*\.html|sitemap\.xml|robots\.txt|assets/|.*\..*).*)
        destination: /index.html
