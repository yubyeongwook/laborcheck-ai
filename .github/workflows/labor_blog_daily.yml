name: 노무체크 AI 자동 블로그 발행 (하루 3회 무인 스케줄러)

on:
  schedule:
    # KST 기준 매일 07:00 (UTC 22:00 전날)
    - cron: '0 22 * * *'
    # KST 기준 매일 12:30 (UTC 03:30)
    - cron: '30 3 * * *'
    # KST 기준 매일 18:00 (UTC 09:00)
    - cron: '0 9 * * *'
  workflow_dispatch: # GitHub UI에서 언제든지 'Run workflow' 버튼 클릭하여 수동 실행 가능

jobs:
  auto_publish_labor_blog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install python-wordpress-xmlrpc requests urllib3 google-genai

      - name: 노무체크 AI 시리즈 포스팅 자동 발행 실행
        env:
          WP_USER: ${{ secrets.WP_USER }}
          WP_PASS: ${{ secrets.WP_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/auto_scheduled_publisher.py
